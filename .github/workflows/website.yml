name: website

# skyblip.eu: a Parklife static build of website/, served from GitHub Pages.
#
# The site shares this tree with the firmware, so every job here is gated on the
# commit having touched website/, or firmware/ and simulator/ because the page
# embeds the WASM and its case. A merge elsewhere must not spend a Pages
# deployment, and a content typo must not wait on a 5-minute cross build.
on:
  pull_request:
  push:
    branches: [main]
  # The escape hatch: a Pages setting or a domain change the tree cannot see.
  # Always builds, whatever the filter below says.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # A filter, not a `paths:` trigger: a required status check that is never
  # triggered leaves a pull request pending for ever, while a job skipped by `if`
  # reports and satisfies it.
  changes:
    name: what changed
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      pull-requests: read
    outputs:
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            website:
              - 'website/**'
              - 'firmware/**'
              - 'simulator/**'
              - '.github/workflows/website.yml'

  build:
    name: parklife build
    needs: changes
    if: needs.changes.outputs.website == 'true' || github.event_name == 'workflow_dispatch'
    # arm64 runners: cheaper per-minute and native aarch64 gem installs.
    runs-on: ubuntu-26.04-arm
    steps:
      # Full history: the sitemap's lastmod is each page's own `git log -1` date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # `working-directory` is what points bundler-cache at website/Gemfile.lock;
      # without it the cache key is computed from a lockfile that is not there.
      - uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1.326.0
        with:
          bundler-cache: true
          working-directory: website

      # Style and security gates from config/ci.rb, before anything is built.
      - name: ci
        working-directory: website
        run: bin/ci

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages

      # The buttons page embeds a WASM build of the firmware, so the site needs a
      # C++ toolchain. Pinned: an unpinned one changes the bytes we publish
      # without a commit saying so.
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.9
          actions-cache-folder: emsdk-cache

      # Parklife needs the deployment's own base URL to write absolute canonical
      # and hreflang links, which is why it comes from the step above rather than
      # from a constant in the repo.
      # SIMULATOR_REQUIRED makes a missing toolchain fatal here, where a laptop
      # without emsdk renders the page's fallback and builds the rest.
      - name: build
        working-directory: website
        env:
          SIMULATOR_REQUIRED: 1
        run: bin/static-build --base "${{ steps.pages.outputs.base_url }}"

      - name: upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: website/build

  deploy:
    name: deploy to pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04-arm
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One live site, so a queued deployment waits instead of racing the one
    # ahead of it.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
